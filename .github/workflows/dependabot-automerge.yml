name: Dependabot Auto-merge

# This privileged event reads metadata only. Never check out or run PR code here.
on:
  pull_request_target:
    types: [ opened, reopened, synchronize ]

permissions: {}

jobs:
  automerge:
    name: Enable auto-merge for development updates
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Read dependency metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}
      # Runtime dependencies, Actions and the Better Auth family need review.
      # Auto-merge still waits for the repository's CI and review requirements.
      - name: Enable auto-merge
        if: >-
          steps.metadata.outputs.package-ecosystem == 'npm_and_yarn' &&
          steps.metadata.outputs.dependency-type == 'direct:development' &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
           steps.metadata.outputs.update-type == 'version-update:semver-minor') &&
          !contains(steps.metadata.outputs.dependency-names, 'auth')
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge --auto --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
