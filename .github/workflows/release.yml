name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Use Node.js 24.x
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use npm with trusted publishing support
        run: npm install --global npm@11.18.0

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Type-check a consumer of the built package
        run: npm run test:types

      # Prereleases (e.g. v3.0.0-beta.0) go to the `next` dist-tag so they
      # never become `latest`.
      - name: Publish to npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi
          case "$VERSION" in
            *-*) npm publish --access public --tag next ;;
            *) npm publish --access public ;;
          esac

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
