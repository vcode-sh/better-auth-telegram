name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  merge_group:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      # Build includes publint and Are The Types Wrong. The consumer check
      # installs the tarball outside this checkout and checks ESM, CJS and types.
      - run: npm run build
      - run: npm run test:package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ github.sha }}
          path: better-auth-telegram-*.tgz
          if-no-files-found: error
          retention-days: 7

  test:
    name: Node ${{ matrix.node }} / Better Auth ${{ matrix.better-auth }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 24.0.0
            better-auth: locked
          - node: 24.x
            better-auth: locked
          - node: 26.x
            better-auth: locked
          - node: 24.x
            better-auth: 1.7.12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Install the minimum supported Better Auth family
        if: matrix.better-auth != 'locked'
        env:
          BETTER_AUTH_VERSION: ${{ matrix.better-auth }}
        run: >-
          npm install --no-save --package-lock=false
          better-auth@"$BETTER_AUTH_VERSION" @better-auth/core@"$BETTER_AUTH_VERSION"
          @better-auth/drizzle-adapter@"$BETTER_AUTH_VERSION"
          @better-auth/kysely-adapter@"$BETTER_AUTH_VERSION"
          @better-auth/mongo-adapter@"$BETTER_AUTH_VERSION"
          @better-auth/prisma-adapter@"$BETTER_AUTH_VERSION" auth@"$BETTER_AUTH_VERSION"
      - name: Check types against the minimum Better Auth version
        if: matrix.better-auth != 'locked'
        run: npm run type-check
      - name: Tests with coverage
        if: matrix.node == '24.x' && matrix.better-auth == 'locked'
        run: npm run test:coverage
      - name: Tests
        if: matrix.node != '24.x' || matrix.better-auth != 'locked'
        run: npm test
      - name: Upload coverage
        if: >-
          matrix.node == '24.x' && matrix.better-auth == 'locked' &&
          github.ref_type != 'tag' &&
          (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-bun:
    name: Bun
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # Use the same locked dependency graph as Node, then force Bun rather
      # than following Vitest's Node shebang.
      - run: npm ci
      - run: bun --bun run test

  adapters:
    name: Database adapters
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: bat
          POSTGRES_PASSWORD: bat
          POSTGRES_DB: bat
        ports: [ 5432 ]
        options: >-
          --health-cmd "pg_isready -U bat"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: bat
          MYSQL_DATABASE: bat
        ports: [ 3306 ]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pbat"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Start MongoDB replica set
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name bat-mongo -p 127.0.0.1::27017 mongo:8.2 --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec bat-mongo mongosh --quiet --eval 'if (db.adminCommand({ ping: 1 }).ok !== 1) quit(1)'; then
              break
            fi
            if [ "$attempt" = 30 ]; then docker logs bat-mongo; exit 1; fi
            sleep 2
          done
          docker exec bat-mongo mongosh --quiet --eval 'rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "127.0.0.1:27017" }] })'
          for attempt in $(seq 1 30); do
            if docker exec bat-mongo mongosh --quiet --eval 'if (!db.hello().isWritablePrimary) quit(1)'; then
              break
            fi
            if [ "$attempt" = 30 ]; then docker logs bat-mongo; exit 1; fi
            sleep 2
          done
          MONGO_PORT=$(docker port bat-mongo 27017/tcp | cut -d: -f2)
          echo "BAT_TEST_MONGODB_URL=mongodb://127.0.0.1:$MONGO_PORT/?replicaSet=rs0&directConnection=true" >> "$GITHUB_ENV"
      - run: npm run test:adapters
        env:
          BAT_TEST_POSTGRES_URL: postgres://bat:bat@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/bat
          BAT_TEST_MYSQL_URL: mysql://root:bat@127.0.0.1:${{ job.services.mysql.ports['3306'] }}/bat
      - name: MongoDB diagnostics
        if: failure()
        run: docker logs bat-mongo || true
      - name: Remove MongoDB
        if: always()
        run: docker rm -fv bat-mongo || true

  gate:
    name: CI
    if: always()
    needs: [ validate, test, test-bun, adapters ]
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation lane
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const results = JSON.parse(process.env.RESULTS); for (const [job, result] of Object.entries(results)) { if (result.result !== "success") { console.error(job + ": " + result.result); process.exitCode = 1; } }'
