version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    ignore:
      # Peer dependencies: upgrades change the supported range and need a
      # deliberate compatibility review, not an automatic dev bump.
      - dependency-name: "better-auth"
      - dependency-name: "@better-auth/*"
      - dependency-name: "auth"
      # Types must match the minimum supported Node.js (engines.node).
      - dependency-name: "@types/node"
        update-types: [ "version-update:semver-major" ]
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-dependencies:
        dependency-type: production

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - ci
